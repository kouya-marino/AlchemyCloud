name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # Gate the release on the same checks as CI. Previously a tag published
  # straight to PyPI with no tests run and no check that the tag matched
  # `project.version` — all seven of v0.1.0..v1.2.0 point at the same commit,
  # so publish.yml fired seven times each trying to upload version 1.2.0.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check the tag matches project.version
        run: |
          python - <<'PY'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          want = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if tag != f"v{want}":
              sys.exit(f"tag {tag} does not match pyproject version {want} (expected v{want})")
          print(f"tag {tag} matches pyproject version {want}")
          PY
      - name: System libs for headless Qt/OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libdbus-1-3
      - name: Install package (with dev extras)
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check alchemycloud tests
          ruff format --check alchemycloud tests
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a pytest tests/ -q

  publish:
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: false
